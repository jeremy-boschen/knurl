pre-commit:
  parallel: true
  commands:
    format-all:
      run: yarn format
    lint-all:
      run: yarn lint

pre-push:
  parallel: false
  commands:
    test-all:
      run: yarn test:unit
    coverage:
      run: yarn test:coverage

commit-msg:
  commands:
    commitlint:
      run: yarn commitlint --edit {1}
