no_tty: true
colors: true

pre-commit:
  parallel: true
  commands:
    format-all:
      run: yarn build:format
    lint-all:
      run: yarn check:lint

pre-push:
  parallel: false
  commands:
    test-unit:
      run: yarn test:unit

commit-msg:
  commands:
    commitlint:
      run: node node_modules/@commitlint/cli/cli.js --edit {1}
