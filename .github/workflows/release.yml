name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows x64'
        required: false
        type: boolean
        default: true
      build_macos_intel:
        description: 'Build macOS Intel (x86_64)'
        required: false
        type: boolean
        default: true
      build_macos_arm:
        description: 'Build macOS ARM (aarch64)'
        required: false
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux x64'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  configure:
    name: Configure Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.result }}
    steps:
      - id: matrix
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            cat >> $GITHUB_OUTPUT << 'EOF'
          result={"include":[
            {"platform":"windows-latest","target":"x86_64-pc-windows-msvc","args":"","install_linux_deps":false,"install_macos_targets":false},
            {"platform":"macos-latest","target":"x86_64-apple-darwin","args":"--target x86_64-apple-darwin","install_linux_deps":false,"install_macos_targets":true},
            {"platform":"macos-latest","target":"aarch64-apple-darwin","args":"--target aarch64-apple-darwin","install_linux_deps":false,"install_macos_targets":true},
            {"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","args":"","install_linux_deps":true,"install_macos_targets":false}
          ]}
          EOF
          else
            BUILDS=()
            [[ "${{ github.event.inputs.build_windows }}" == "true" ]] && BUILDS+=('{"platform":"windows-latest","target":"x86_64-pc-windows-msvc","args":"","install_linux_deps":false,"install_macos_targets":false}')
            [[ "${{ github.event.inputs.build_macos_intel }}" == "true" ]] && BUILDS+=('{"platform":"macos-latest","target":"x86_64-apple-darwin","args":"--target x86_64-apple-darwin","install_linux_deps":false,"install_macos_targets":true}')
            [[ "${{ github.event.inputs.build_macos_arm }}" == "true" ]] && BUILDS+=('{"platform":"macos-latest","target":"aarch64-apple-darwin","args":"--target aarch64-apple-darwin","install_linux_deps":false,"install_macos_targets":true}')
            [[ "${{ github.event.inputs.build_linux }}" == "true" ]] && BUILDS+=('{"platform":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","args":"","install_linux_deps":true,"install_macos_targets":false}')

            printf 'result={"include":[' >> $GITHUB_OUTPUT
            printf '%s\n' "${BUILDS[@]}" | paste -sd, - >> $GITHUB_OUTPUT
            printf ']}' >> $GITHUB_OUTPUT
          fi

  validate-tag:
    name: Validate Version Tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !github.act
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate tag matches Cargo.toml version
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*version = "\(.*\)".*/\1/')
          if [[ "$TAG_VERSION" != "$CARGO_VERSION" ]]; then
            echo "❌ Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "✅ Tag version matches Cargo.toml version: $CARGO_VERSION"

  build:
    name: Build ${{ matrix.target }}
    needs: configure
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.configure.outputs.matrix) }}
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies (Ubuntu only)
        if: matrix.install_linux_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Prepare Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install macOS targets
        if: matrix.install_macos_targets
        run: |
          source $HOME/.cargo/env
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: yarn install --immutable

      - name: Build
        env:
          CARGO_NET_RETRY: 3
        run: yarn tauri build -- ${{ matrix.args }}

      - name: Prepare release files
        run: |
          mkdir -p release-files
          bash scripts/release/rename-artifacts.sh "${{ github.ref_name }}" "${{ matrix.target }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: release-files/
          if-no-files-found: ignore

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p all-artifacts
          find artifacts -type f -exec cp {} all-artifacts/ \;
          ls -lah all-artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            all-artifacts/* \
            --draft \
            --title "${{ github.ref_name }}" \
            --notes "See the assets to download this version and install."
