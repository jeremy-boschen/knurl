name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION=$(git tag -l 'v*' --sort=-version:refname | head -1)
            if [[ -z "$VERSION" ]]; then
              echo "⚠️ No tags found, using version from package.json"
              VERSION="v$(grep '"version"' package.json | head -1 | sed 's/.*"\([^"]*\)".*/\1/')"
            fi
          fi
          echo "result=$VERSION" >> $GITHUB_OUTPUT

  build:
    needs: resolve-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies (Ubuntu only)
        if: contains(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Prepare Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install macOS targets
        if: contains(matrix.target, 'apple-darwin')
        run: |
          source $HOME/.cargo/env
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: yarn install --immutable

      - name: Build
        env:
          CARGO_NET_RETRY: 3
        run: |
          ARGS=""
          [[ "${{ matrix.target }}" == *apple-darwin ]] && ARGS="--target ${{ matrix.target }}"
          yarn tauri build -- $ARGS

      - name: Prepare release files
        run: |
          mkdir -p release-files
          bash scripts/release/rename-artifacts.sh "${{ needs.resolve-version.outputs.version }}" "${{ matrix.target }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.target }}
          path: release-files/
          if-no-files-found: ignore

  create-release:
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p all-artifacts
          find artifacts -type f -exec cp {} all-artifacts/ \;
          ls -lah all-artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.resolve-version.outputs.version }}" \
            all-artifacts/* \
            --draft \
            --title "${{ needs.resolve-version.outputs.version }}" \
            --notes "See the assets to download this version and install."
