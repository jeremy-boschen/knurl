name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows x64'
        required: false
        type: boolean
        default: true
      build_macos_intel:
        description: 'Build macOS Intel (x86_64)'
        required: false
        type: boolean
        default: true
      build_macos_arm:
        description: 'Build macOS ARM (aarch64)'
        required: false
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux x64'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  validate-tag:
    name: Validate Version Tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate tag matches Cargo.toml version
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*version = "\(.*\)".*/\1/')
          if [[ "$TAG_VERSION" != "$CARGO_VERSION" ]]; then
            echo "❌ Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "✅ Tag version matches Cargo.toml version: $CARGO_VERSION"

  build-windows:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build_windows == 'true')
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        shell: bash

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
        shell: bash

      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target
          key: ${{ runner.os }}-cargo-x86_64-pc-windows-msvc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-x86_64-pc-windows-msvc-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: yarn install --immutable

      - name: Build frontend
        run: yarn vite build

      - name: Build app
        env:
          CARGO_NET_RETRY: 3
        run: npm run tauri build

      - name: Prepare release files
        run: |
          mkdir -p release-files
          bash scripts/release/rename-artifacts.sh "${{ github.ref_name }}" x86_64-pc-windows-msvc

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-x86_64-pc-windows-msvc
          path: release-files/
          if-no-files-found: ignore

  build-macos-intel:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build_macos_intel == 'true')
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        shell: bash

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
        shell: bash

      - name: Install macOS targets
        run: |
          source $HOME/.cargo/env
          rustup target add x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target
          key: ${{ runner.os }}-cargo-x86_64-apple-darwin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-x86_64-apple-darwin-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: yarn install --immutable

      - name: Build frontend
        run: yarn vite build

      - name: Build app
        env:
          CARGO_NET_RETRY: 3
        run: npm run tauri build -- --target x86_64-apple-darwin

      - name: Prepare release files
        run: |
          mkdir -p release-files
          bash scripts/release/rename-artifacts.sh "${{ github.ref_name }}" x86_64-apple-darwin

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-x86_64-apple-darwin
          path: release-files/
          if-no-files-found: ignore

  build-macos-arm:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build_macos_arm == 'true')
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        shell: bash

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
        shell: bash

      - name: Install macOS targets
        run: |
          source $HOME/.cargo/env
          rustup target add aarch64-apple-darwin

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target
          key: ${{ runner.os }}-cargo-aarch64-apple-darwin-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-aarch64-apple-darwin-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: yarn install --immutable

      - name: Build frontend
        run: yarn vite build

      - name: Build app
        env:
          CARGO_NET_RETRY: 3
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Prepare release files
        run: |
          mkdir -p release-files
          bash scripts/release/rename-artifacts.sh "${{ github.ref_name }}" aarch64-apple-darwin

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-aarch64-apple-darwin
          path: release-files/
          if-no-files-found: ignore

  build-linux:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.build_linux == 'true')
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Prepare Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        shell: bash

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
        shell: bash

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target
          key: ${{ runner.os }}-cargo-x86_64-unknown-linux-gnu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-x86_64-unknown-linux-gnu-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: yarn install --immutable

      - name: Build frontend
        run: yarn vite build

      - name: Build app
        env:
          CARGO_NET_RETRY: 3
        run: npm run tauri build

      - name: Prepare release files
        run: |
          mkdir -p release-files
          bash scripts/release/rename-artifacts.sh "${{ github.ref_name }}" x86_64-unknown-linux-gnu

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-x86_64-unknown-linux-gnu
          path: release-files/
          if-no-files-found: ignore

  create-release:
    needs: [build-windows, build-macos-intel, build-macos-arm, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p all-artifacts
          find artifacts -type f -exec cp {} all-artifacts/ \;
          ls -lah all-artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            all-artifacts/* \
            --draft \
            --title "${{ github.ref_name }}" \
            --notes "See the assets to download this version and install."
