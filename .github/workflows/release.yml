name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_windows:
        description: 'Build Windows x64'
        required: false
        type: boolean
        default: true
      build_macos_intel:
        description: 'Build macOS Intel (x86_64)'
        required: false
        type: boolean
        default: true
      build_macos_arm:
        description: 'Build macOS ARM (aarch64)'
        required: false
        type: boolean
        default: true
      build_linux:
        description: 'Build Linux x64'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  validate-tag:
    name: Validate Version Tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && !github.act
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate tag matches Cargo.toml version
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          CARGO_VERSION=$(grep '^version' src-tauri/Cargo.toml | head -1 | sed 's/.*version = "\(.*\)".*/\1/')
          if [[ "$TAG_VERSION" != "$CARGO_VERSION" ]]; then
            echo "❌ Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "✅ Tag version matches Cargo.toml version: $CARGO_VERSION"

  build-windows:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_windows == 'true')
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      args: ''

  build-macos-intel:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_macos_intel == 'true')
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: macos-latest
      target: x86_64-apple-darwin
      args: '--target x86_64-apple-darwin'
      install_macos_targets: true

  build-macos-arm:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_macos_arm == 'true')
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: macos-latest
      target: aarch64-apple-darwin
      args: '--target aarch64-apple-darwin'
      install_macos_targets: true

  build-linux:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.build_linux == 'true')
    uses: ./.github/workflows/build-platform.yml
    with:
      platform: ubuntu-22.04
      target: x86_64-unknown-linux-gnu
      args: ''
      install_linux_deps: true

  create-release:
    needs: [build-windows, build-macos-intel, build-macos-arm, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p all-artifacts
          find artifacts -type f -exec cp {} all-artifacts/ \;
          ls -lah all-artifacts/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            all-artifacts/* \
            --draft \
            --title "${{ github.ref_name }}" \
            --notes "See the assets to download this version and install."
