name: Build Platform

on:
  workflow_call:
    inputs:
      platform:
        type: string
        required: true
      target:
        type: string
        required: true
      args:
        type: string
        required: false
        default: ''
      install_linux_deps:
        type: boolean
        required: false
        default: false
      install_macos_targets:
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ${{ inputs.platform }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies (Ubuntu only)
        if: inputs.install_linux_deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config

      - name: Prepare Corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        shell: bash

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
        shell: bash

      - name: Add Rust to PATH (Windows)
        if: runner.os == 'Windows'
        run: echo "$HOME/.cargo/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install macOS targets
        if: inputs.install_macos_targets
        run: |
          source $HOME/.cargo/env
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ inputs.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ inputs.target }}-
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: yarn install --immutable

      - name: Build frontend
        run: yarn vite build

      - name: Build app
        env:
          CARGO_NET_RETRY: 3
        run: npm run tauri build -- ${{ inputs.args }}

      - name: Prepare release files
        run: |
          mkdir -p release-files
          bash scripts/release/rename-artifacts.sh "${{ github.ref_name }}" "${{ inputs.target }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: release-${{ inputs.target }}
          path: release-files/
          if-no-files-found: ignore
