name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  tests:
    if: false
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Prepare Corepack
        run: |
          corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "yarn"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config
      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: yarn install --immutable
      - name: Build Frontend
        run: yarn vite build
      - name: Clean debug artifacts (avoid profile conflicts with cache)
        run: rm -rf src-tauri/target/debug/deps
      - name: Run Tests
        env:
          VITEST_MAX_WORKERS: 2
          CARGO_INCREMENTAL: 1
          CARGO_NET_RETRY: 3
        run: yarn test:unit 2>&1 | tee /tmp/test-output.log
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-logs
          path: /tmp/test-output.log
          if-no-files-found: ignore

  # Cross-platform build (currently Linux only, will add macOS/Windows when needed)
