name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  linux-ci:
    name: Linux CI (Type Check, Lint, Test, Security)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config
      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      - uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: yarn install --immutable
      - name: TypeScript Type Checking
        run: yarn typecheck
      - name: Linting & Formatting
        run: yarn lint
      - name: Build App for Testing
        run: |
          yarn generate:knurl-icon
          yarn vite build
          cd src-tauri && cargo build --profile e2e-test
      - name: Critical Tests (Unit + E2E)
        env:
          VITEST_MAX_WORKERS: 2
        run: yarn test:check 2>&1 | tee /tmp/test-output.log
        continue-on-error: true
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/test-output.log
          if-no-files-found: ignore
      - name: Security Audits (npm)
        run: yarn npm audit --audit-level moderate || true
      - name: Security Audits (cargo)
        run: cargo install cargo-audit && cargo audit --file src-tauri/Cargo.lock

