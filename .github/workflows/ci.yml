name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  linux-ci:
    name: Linux CI (Type Check, Lint, Test, Security)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - run: yarn install --immutable
      - name: TypeScript Type Checking
        run: yarn typecheck
      - name: Linting & Formatting
        run: yarn lint --max-warnings=0
      - name: Unit Tests
        run: yarn test:unit 2>&1 | tee /tmp/test-output.log
      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-merged.xml
          fail_ci_if_error: false
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: /tmp/test-output.log
          if-no-files-found: ignore
      - name: E2E Tests (Critical)
        run: yarn test:check 2>&1 | tee /tmp/e2e-test-output.log
        continue-on-error: true
      - name: Upload E2E test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-logs
          path: /tmp/e2e-test-output.log
          if-no-files-found: ignore
      - name: Security Audits (npm)
        run: yarn npm audit --audit-level moderate || true
      - name: Security Audits (cargo)
        run: cargo install cargo-audit && cargo audit --file src-tauri/Cargo.lock

  build:
    name: Build Check
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # Temporarily disabled - non-Linux builds
          # - os: macos-latest
          #   target: x86_64-apple-darwin
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          # - os: windows-latest
          #   target: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
      - name: Install Rust
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
        shell: bash
      # Linux only - no need for Windows PATH setup or cross-compilation targets
      # - name: Add Rust to PATH (Windows)
      #   if: runner.os == 'Windows'
      #   run: echo "$HOME/.cargo/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # - name: Install target
      #   run: |
      #     source $HOME/.cargo/env 2>/dev/null || true
      #     rustup target add ${{ matrix.target }}
      #   shell: bash
      - uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config
      - run: yarn install --immutable
      - name: Build frontend
        run: yarn build
      - name: Build Rust backend
        run: cargo build --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
